<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Products')"></head>
<body class="theme-admin">
<div class="admin-shell">
    <div th:replace="fragments/admin-shell :: sidebar(${activePage})"></div>
    <div class="admin-main">
        <div th:replace="fragments/admin-shell :: header(${adminPrincipal})"></div>
        <main class="admin-content">
            <section class="section-header admin-section-header">
                <div>
                    <span class="eyebrow">Products</span>
                    <h1>Package catalog</h1>
                    <p>Packages are modeled as typed benefits. The admin UI edits entitlements, not command strings.</p>
                </div>
                <button class="button button-primary" type="button" data-modal-open="package-modal">New Product</button>
            </section>

            <section class="glass-panel">
                <div class="data-table">
                    <table>
                        <thead>
                        <tr>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Type</th>
                            <th>Price</th>
                            <th>Status</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="pack : ${packages}"
                            th:with="benefit=${benefitsByPackage[pack.id] != null and !#lists.isEmpty(benefitsByPackage[pack.id]) ? benefitsByPackage[pack.id].get(0) : null}">
                            <td>
                                <strong th:text="${pack.name}">Package</strong>
                                <div class="table-subtext" th:text="${pack.slug}">slug</div>
                            </td>
                            <td th:text="${pack.category.name}">Ranks</td>
                            <td th:text="${pack.packageType}">SINGLE</td>
                            <td th:text="'$' + ${#numbers.formatDecimal(pack.price, 1, 2)}">$0.00</td>
                            <td>
                                <span class="pill" th:classappend="${pack.visible} ? ' pill-emerald' : ''" th:text="${pack.visible} ? 'Active' : 'Hidden'">Active</span>
                            </td>
                            <td class="table-actions">
                                <button class="icon-button"
                                        type="button"
                                        data-modal-open="package-modal"
                                        th:attr="data-package-id=${pack.id},
                                                 data-category-slug=${pack.category.slug},
                                                 data-package-slug=${pack.slug},
                                                 data-package-name=${pack.name},
                                                 data-package-short=${pack.shortDescription},
                                                 data-package-description=${pack.descriptionHtml},
                                                 data-package-price=${pack.price},
                                                 data-package-visible=${pack.visible},
                                                 data-package-featured=${pack.featured},
                                                 data-package-giftable=${pack.giftable},
                                                 data-package-type=${pack.packageType},
                                                 data-package-interval=${pack.billingInterval},
                                                 data-package-accent=${pack.accentKey},
                                                 data-benefit-type=${benefit != null ? benefit.benefitType : ''},
                                                 data-benefit-system=${benefit != null ? benefit.targetSystem : ''},
                                                 data-benefit-key=${benefit != null ? benefit.targetKey : ''},
                                                 data-benefit-value=${benefit != null ? benefit.targetValue : ''},
                                                 data-benefit-duration=${benefit != null ? benefit.durationDays : ''},
                                                 data-benefit-stacking=${benefit != null ? benefit.stackingPolicy : ''}">
                                    <i data-lucide="square-pen"></i>
                                </button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>

<div class="modal-shell" data-modal="package-modal">
    <div class="modal-card large">
        <div class="modal-header">
            <div>
                <span class="eyebrow">Package Editor</span>
                <h2 data-package-modal-title>New Product</h2>
            </div>
            <button class="icon-button" type="button" data-modal-close="package-modal"><i data-lucide="x"></i></button>
        </div>
        <form class="stack-form" data-package-form>
            <input type="hidden" name="id">
            <div class="two-column">
                <label>
                    <span>Category</span>
                    <select name="categorySlug">
                        <option th:each="category : ${categories}" th:value="${category.slug}" th:text="${category.name}">Ranks</option>
                    </select>
                </label>
                <label>
                    <span>Slug</span>
                    <input type="text" name="slug">
                </label>
            </div>
            <label>
                <span>Name</span>
                <input type="text" name="name">
            </label>
            <label>
                <span>Short Description</span>
                <input type="text" name="shortDescription">
            </label>
            <label>
                <span>Description (HTML)</span>
                <textarea name="descriptionHtml" rows="5"></textarea>
            </label>
            <div class="three-column">
                <label>
                    <span>Price</span>
                    <input type="number" step="0.01" name="price">
                </label>
                <label>
                    <span>Package Type</span>
                    <select name="packageType">
                        <option value="SINGLE">Single</option>
                        <option value="SUBSCRIPTION">Subscription</option>
                        <option value="BUNDLE">Bundle</option>
                    </select>
                </label>
                <label>
                    <span>Billing Interval</span>
                    <select name="billingInterval">
                        <option value="NONE">None</option>
                        <option value="MONTHLY">Monthly</option>
                        <option value="YEARLY">Yearly</option>
                    </select>
                </label>
            </div>
            <div class="three-column checkbox-row">
                <label class="checkbox-chip"><input type="checkbox" name="visible"><span>Visible</span></label>
                <label class="checkbox-chip"><input type="checkbox" name="featured"><span>Featured</span></label>
                <label class="checkbox-chip"><input type="checkbox" name="giftable" checked><span>Giftable</span></label>
            </div>
            <div class="three-column">
                <label>
                    <span>Accent Key</span>
                    <input type="text" name="accentKey" placeholder="amber">
                </label>
                <label>
                    <span>Benefit Type</span>
                    <select name="benefitType">
                        <option value="RANK">Rank</option>
                        <option value="PERMISSION_GROUP">Permission Group</option>
                        <option value="COINS">Coins</option>
                        <option value="COSMETIC">Cosmetic</option>
                        <option value="BUNDLE_CHILD">Bundle Child</option>
                    </select>
                </label>
                <label>
                    <span>Target System</span>
                    <input type="text" name="targetSystem" placeholder="velocity-rank">
                </label>
            </div>
            <div class="three-column">
                <label>
                    <span>Target Key</span>
                    <input type="text" name="targetKey" placeholder="rank">
                </label>
                <label>
                    <span>Target Value</span>
                    <input type="text" name="targetValue" placeholder="god">
                </label>
                <label>
                    <span>Duration Days</span>
                    <input type="number" name="durationDays" placeholder="optional">
                </label>
            </div>
            <label>
                <span>Stacking Policy</span>
                <select name="stackingPolicy">
                    <option value="REPLACE">Replace</option>
                    <option value="STACK">Stack</option>
                    <option value="IGNORE">Ignore</option>
                </select>
            </label>
            <div class="modal-actions">
                <button class="button button-secondary" type="button" data-modal-close="package-modal">Cancel</button>
                <button class="button button-primary" type="submit">Save Package</button>
            </div>
            <div class="form-status" data-package-status></div>
        </form>
    </div>
</div>

<script defer th:src="@{/js/admin.js}"></script>
</body>
</html>
