<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Players & CRM')"></head>
<body class="theme-admin">
<div class="admin-shell">
    <div th:replace="fragments/admin-shell :: sidebar(${activePage})"></div>
    <div class="admin-main">
        <div th:replace="fragments/admin-shell :: header(${adminPrincipal})"></div>
        <main class="admin-content">
            <section class="section-header admin-section-header">
                <div>
                    <span class="eyebrow">Player CRM</span>
                    <h1>Whale watcher</h1>
                    <p>Track lifetime value, player identity, and which accounts will notice when fulfillment drifts.</p>
                </div>
            </section>

            <section class="glass-panel">
                <div class="data-table">
                    <table>
                        <thead>
                        <tr>
                            <th>Player</th>
                            <th>LTV</th>
                            <th>Orders</th>
                            <th>Status</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="player : ${players}">
                            <td>
                                <div class="table-user">
                                    <span class="avatar-square" th:text="${#strings.substring(player.username(),0,1).toUpperCase()}">P</span>
                                    <div>
                                        <strong th:text="${player.username()}">Player</strong>
                                        <span th:text="${player.playerUuid()}">uuid</span>
                                    </div>
                                </div>
                            </td>
                            <td th:text="'$' + ${#numbers.formatDecimal(player.totalSpent(), 1, 2)}">$0.00</td>
                            <td th:text="${player.orderCount()}">0</td>
                            <td>
                                <span class="pill" th:classappend="${player.flagged()} ? ' pill-rose' : ' pill-emerald'"
                                      th:text="${player.flagged()} ? 'Flagged' : 'Healthy'}">Healthy</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>
<script defer th:src="@{/js/admin.js}"></script>
</body>
</html>
