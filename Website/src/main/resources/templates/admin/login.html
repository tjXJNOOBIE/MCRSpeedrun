<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Admin Login')"></head>
<body class="theme-admin theme-admin-auth">
<main class="auth-shell">
    <section class="auth-card">
        <div class="auth-copy">
            <span class="eyebrow">Operations Access</span>
            <h1>Store administration</h1>
            <p>Sign in with your break-glass local account or an approved Google/Discord identity that is mapped to an admin user record.</p>
        </div>

        <p class="form-status is-error" th:if="${param.error}">
            Sign-in failed. Check your credentials and try again.
        </p>
        <p class="form-status is-success" th:if="${param.logout}">
            You have been signed out of the admin dashboard.
        </p>

        <form class="stack-form" method="post" th:action="@{/admin/login}" th:if="${localAdminEnabled}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label>
                <span>Username or Email</span>
                <input type="text" name="username" autocomplete="username" autofocus required>
            </label>
            <label>
                <span>Password</span>
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <button class="button button-primary button-block" type="submit">Sign In</button>
        </form>

        <div class="oauth-stack" th:if="${oauthRegistrations != null}">
            <a class="button button-secondary button-block"
               th:each="registration : ${oauthRegistrations}"
               th:href="@{/oauth2/authorization/{id}(id=${registration.registrationId})}">
                <i data-lucide="log-in"></i>
                <span th:text="'Continue with ' + ${registration.clientName}">Continue with OAuth</span>
            </a>
        </div>
    </section>
</main>
<script defer th:src="@{/js/admin.js}"></script>
</body>
</html>
