<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Support Desk')"></head>
<body class="theme-admin">
<div class="admin-shell">
    <div th:replace="fragments/admin-shell :: sidebar(${activePage})"></div>
    <div class="admin-main">
        <div th:replace="fragments/admin-shell :: header(${adminPrincipal})"></div>
        <main class="admin-content">
            <section class="section-header admin-section-header">
                <div>
                    <span class="eyebrow">Support Desk</span>
                    <h1>Operations queue</h1>
                    <p>The current build surfaces support-related audit activity and fulfillment exceptions in one place so failed grants can be handled immediately.</p>
                </div>
            </section>
            <div class="form-status" data-admin-action-status></div>

            <section class="admin-grid admin-grid-two-thirds">
                <article class="glass-panel">
                    <div class="panel-header">
                        <h2>Recent Audit Events</h2>
                    </div>
                    <div class="stack-list compact">
                        <article class="list-row" th:each="entry : ${auditEntries}">
                            <div>
                                <strong th:text="${entry.action}">ACTION</strong>
                                <span th:text="${entry.targetType} + ' • ' + ${entry.targetId}">target</span>
                            </div>
                            <div class="list-meta">
                                <strong th:text="${entry.actorId}">actor</strong>
                                <span th:text="${#temporals.format(entry.createdAt, 'yyyy-MM-dd HH:mm')}">2026-04-03</span>
                            </div>
                        </article>
                    </div>
                </article>

                <article class="glass-panel">
                    <div class="panel-header">
                        <h2>Fulfillment Failures</h2>
                    </div>
                    <div class="stack-list compact">
                        <article class="list-row" th:each="job : ${fulfillmentJobs}">
                            <div>
                                <strong th:text="'Job #' + ${job.id}">Job #1</strong>
                                <span th:text="${job.entitlement.playerAccount.currentUsername} + ' • ' + ${job.entitlement.targetValue}">player • rank</span>
                            </div>
                            <div class="list-meta support-actions">
                                <div class="support-action-copy">
                                    <strong th:text="${job.status}">FAILED</strong>
                                    <span th:text="${job.lastError != null ? job.lastError : 'No error text'}">No error text</span>
                                </div>
                                <div class="support-action-buttons">
                                    <button class="icon-button"
                                            type="button"
                                            data-retry-fulfillment
                                            title="Retry fulfillment job"
                                            th:attr="data-job-id=${job.id}">
                                        <i data-lucide="refresh-cw"></i>
                                    </button>
                                    <button class="icon-button"
                                            type="button"
                                            data-revoke-entitlement
                                            th:if="${job.entitlement.state.name() != 'REVOKED'}"
                                            title="Revoke entitlement"
                                            th:attr="data-entitlement-id=${job.entitlement.id}">
                                        <i data-lucide="undo-2"></i>
                                    </button>
                                </div>
                            </div>
                        </article>
                    </div>
                </article>
            </section>
        </main>
    </div>
</div>
<script defer th:src="@{/js/admin.js}"></script>
</body>
</html>
