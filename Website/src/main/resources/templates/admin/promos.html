<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Promotions')"></head>
<body class="theme-admin">
<div class="admin-shell">
    <div th:replace="fragments/admin-shell :: sidebar(${activePage})"></div>
    <div class="admin-main">
        <div th:replace="fragments/admin-shell :: header(${adminPrincipal})"></div>
        <main class="admin-content">
            <section class="section-header admin-section-header">
                <div>
                    <span class="eyebrow">Promotions &amp; Coupons</span>
                    <h1>Discount controls</h1>
                    <p>Coupons remain first-class records and can be reconciled back to real orders and webhook events.</p>
                </div>
            </section>

            <section class="admin-grid admin-grid-two-thirds">
                <article class="glass-panel">
                    <div class="panel-header">
                        <h2>Coupons</h2>
                    </div>
                    <div class="card-grid two">
                        <article class="coupon-card" th:each="coupon : ${coupons}">
                            <div class="coupon-card-top">
                                <strong th:text="${coupon.code}">SUMMER26</strong>
                                <span class="pill" th:classappend="${coupon.active} ? ' pill-emerald' : ''" th:text="${coupon.active} ? 'Active' : 'Inactive'}">Active</span>
                            </div>
                            <p th:text="${coupon.couponType} + ' discount'">Percentage discount</p>
                            <div class="coupon-bar">
                                <div class="coupon-bar-fill" th:style="'width:' + ${coupon.maxUses != null and coupon.maxUses > 0 ? (coupon.useCount * 100 / coupon.maxUses) : 18} + '%'"></div>
                            </div>
                            <div class="coupon-meta">
                                <span th:text="${coupon.useCount} + ' uses'">0 uses</span>
                                <span th:text="${coupon.maxUses != null ? coupon.maxUses + ' max' : 'Unlimited'}">Unlimited</span>
                            </div>
                        </article>
                    </div>
                </article>

                <article class="glass-panel">
                    <div class="panel-header">
                        <h2>Promotion Records</h2>
                    </div>
                    <div class="stack-list compact">
                        <article class="list-row" th:each="promotion : ${promotions}">
                            <div>
                                <strong th:text="${promotion.name}">Promotion</strong>
                                <span th:text="${promotion.targetType}">GLOBAL</span>
                            </div>
                            <div class="list-meta">
                                <strong th:text="${promotion.discountValue} + (${promotion.discountType.name() == 'PERCENTAGE'} ? '%' : '$')">20%</strong>
                                <span th:text="${promotion.status}">ACTIVE</span>
                            </div>
                        </article>
                    </div>
                </article>
            </section>
        </main>
    </div>
</div>
<script defer th:src="@{/js/admin.js}"></script>
</body>
</html>
