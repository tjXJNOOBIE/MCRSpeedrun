<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="admin-sidebar" th:fragment="sidebar(activePage)">
    <div class="admin-brand">
        <span class="admin-brand-mark"><i data-lucide="activity"></i></span>
        <span class="admin-brand-text">Nexus<span>Admin</span></span>
    </div>
    <div class="admin-nav-group">
        <div class="admin-nav-title">Management</div>
        <a class="admin-nav-link" th:classappend="${activePage == 'overview'} ? ' is-active'" th:href="@{/admin}">
            <i data-lucide="layout-dashboard"></i><span>Overview</span>
        </a>
        <a class="admin-nav-link" th:classappend="${activePage == 'customers'} ? ' is-active'" th:href="@{/admin/customers}">
            <i data-lucide="users"></i><span>Players &amp; CRM</span>
        </a>
        <a class="admin-nav-link" th:classappend="${activePage == 'products'} ? ' is-active'" th:href="@{/admin/products}">
            <i data-lucide="package"></i><span>Products</span>
        </a>
        <a class="admin-nav-link" th:classappend="${activePage == 'sales'} ? ' is-active'" th:href="@{/admin/sales}">
            <i data-lucide="calendar-range"></i><span>Sale Events</span>
        </a>
        <a class="admin-nav-link" th:classappend="${activePage == 'promos'} ? ' is-active'" th:href="@{/admin/promos}">
            <i data-lucide="tag"></i><span>Promotions</span>
        </a>
        <a class="admin-nav-link" th:classappend="${activePage == 'support'} ? ' is-active'" th:href="@{/admin/support}">
            <i data-lucide="life-buoy"></i><span>Support Desk</span>
        </a>
        <a class="admin-nav-link" th:classappend="${activePage == 'settings'} ? ' is-active'" th:href="@{/admin/settings}">
            <i data-lucide="settings"></i><span>Settings</span>
        </a>
    </div>
    <div class="admin-sidebar-footer">
        <a class="admin-nav-link" th:href="@{/}">
            <i data-lucide="store"></i><span>View Storefront</span>
        </a>
        <form th:action="@{/admin/logout}" method="post">
            <button class="admin-nav-link admin-nav-button" type="submit">
                <i data-lucide="log-out"></i><span>Sign Out</span>
            </button>
        </form>
    </div>
</aside>

<header class="admin-header" th:fragment="header(adminPrincipal)">
    <div class="admin-search">
        <i data-lucide="search"></i>
        <input type="search" placeholder="Search orders, players, packages">
    </div>
    <div class="admin-header-actions">
        <button class="icon-button" type="button">
            <i data-lucide="bell"></i>
        </button>
        <div class="admin-avatar" th:text="${adminPrincipal != null ? #strings.substring(adminPrincipal.username,0,1).toUpperCase() : 'A'}">A</div>
    </div>
</header>
</body>
</html>
