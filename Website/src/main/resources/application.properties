spring.application.name=Website
spring.devtools.remote.secret=${WEBSITE_DEVTOOLS_SECRET:local-devtools-secret}
spring.mvc.hiddenmethod.filter.enabled=true
spring.thymeleaf.cache=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.datasource.url=${NOVUS_POSTGRES_URL:jdbc:postgresql://localhost:15432/tavall}
spring.datasource.username=${NOVUS_POSTGRES_USER:novus}
spring.datasource.password=${NOVUS_POSTGRES_PASS:novus}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=store_flyway_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

app.store.base-url=${APP_STORE_BASE_URL:http://localhost:8080}
app.store.account-session-cookie=NOVUS_STORE_PLAYER
app.store.integration.bootstrap-secret=${APP_STORE_INTEGRATION_BOOTSTRAP_SECRET:change-me}
app.store.integration.token-secret=${APP_STORE_INTEGRATION_TOKEN_SECRET:change-me-too}
app.store.integration.token-ttl-seconds=${APP_STORE_INTEGRATION_TOKEN_TTL_SECONDS:900}
app.store.integration.test-mode-enabled=${APP_STORE_INTEGRATION_TEST_MODE_ENABLED:false}
app.store.stripe.secret-key=${APP_STORE_STRIPE_SECRET_KEY:}
app.store.stripe.publishable-key=${APP_STORE_STRIPE_PUBLISHABLE_KEY:}
app.store.stripe.webhook-secret=${APP_STORE_STRIPE_WEBHOOK_SECRET:}
app.store.stripe.success-path=${APP_STORE_STRIPE_SUCCESS_PATH:/checkout/success}
app.store.stripe.cancel-path=${APP_STORE_STRIPE_CANCEL_PATH:/checkout/cancel}
app.store.local-admin.enabled=${APP_STORE_LOCAL_ADMIN_ENABLED:true}
app.store.local-admin.default-role=${APP_STORE_LOCAL_ADMIN_DEFAULT_ROLE:ADMIN}
app.store.local-admin.seed-username=${APP_STORE_LOCAL_ADMIN_SEED_USERNAME:admin}
app.store.local-admin.seed-email=${APP_STORE_LOCAL_ADMIN_SEED_EMAIL:admin@example.com}
app.store.local-admin.seed-password=${APP_STORE_LOCAL_ADMIN_SEED_PASSWORD:change-me-now}
app.store.oauth.google.client-id=${APP_STORE_GOOGLE_CLIENT_ID:}
app.store.oauth.google.client-secret=${APP_STORE_GOOGLE_CLIENT_SECRET:}
app.store.oauth.discord.client-id=${APP_STORE_DISCORD_CLIENT_ID:}
app.store.oauth.discord.client-secret=${APP_STORE_DISCORD_CLIENT_SECRET:}
app.store.oauth.discord.redirect-uri=${APP_STORE_DISCORD_REDIRECT_URI:{baseUrl}/login/oauth2/code/discord}
